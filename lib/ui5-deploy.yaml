# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
# starj.ui5.table 을 ABAP 저장소(BSP ZSTARJ_TABLE)에 올린다: npm run deploy
# 접속 정보는 파일에 적지 않는다. "env:" 로 시작하는 값은 배포 태스크가 환경 변수로 바꾼다.
#   SAP_URL, SAP_CLIENT, SAP_USER, SAP_PASSWORD  접속 (rap-guideline-docs/.env 와 같은 이름)
#   DEPLOY_PACKAGE                               ZSTARJ_UI5, 시험 배포는 $TMP
#   DEPLOY_TRANSPORT                             전송요청 번호, $TMP 면 빈 값
specVersion: "4.0"
type: library
metadata:
  name: starj.ui5.table
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  customTasks:
    # ui5 build 안에서 돌므로 빌드 결과(library-preload.js 포함)가 그대로 올라간다
    - name: deploy-to-abap
      afterTask: buildThemes
      configuration:
        yes: true                 # 확인 질문 없이 올린다 (npm run deploy 를 친 것이 확인이다)
        ignoreCertErrors: false   # 자체 서명 인증서 시스템이면 true 로 바꾼다
        target:
          url: env:SAP_URL
          client: env:SAP_CLIENT
        credentials:
          username: env:SAP_USER
          password: env:SAP_PASSWORD
        app:
          name: ZSTARJ_TABLE
          description: starj.ui5.table UI5 library
          package: env:DEPLOY_PACKAGE
          transport: env:DEPLOY_TRANSPORT
